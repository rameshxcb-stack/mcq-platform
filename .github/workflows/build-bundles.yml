name: Build Bundles
on:
  schedule:
    - cron: '0 15 * * *'   # 🕒 Ye 3 PM (दोपहर 3 बजे) के लिए है
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - name: Build bundles
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: deno run --allow-all scripts/build-bundles.ts
